name: release-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)build assets for
        required: true
        default: v1.0.0
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build package
        run: |
          set -euo pipefail
          mkdir -p dist/dsh-restart-button
          cp package.json index.js client.js restart-helper.js cordis.patch.yml README.md README.zh-CN.md LICENSE dist/dsh-restart-button/
          cp INSTALL.zh-CN.md dist/安装说明.md
          npm pack --pack-destination dist
          cd dist
          zip -r dsh-restart-button-1.0.0.zip dsh-restart-button 安装说明.md dsh-restart-button-1.0.0.tgz
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/dsh-restart-button-1.0.0.zip dist/dsh-restart-button-1.0.0.tgz --clobber
